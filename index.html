<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e5e4d7" />
    <link rel="icon" type="image/png" href="./assets/logo.png?v=1" />
    <link rel="shortcut icon" type="image/png" href="./assets/logo.png?v=1" />
    <link rel="apple-touch-icon" href="./assets/logo.png?v=1" />
    <meta
      name="description"
      content="The Jard — Coming Soon"
    />
    <title>The Jard — Coming Soon</title>

    <style>
      @font-face {
        font-family: "Archivo";
        src: url("./assets/fonts/Archivo-Regular.otf") format("opentype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "Archivo";
        src: url("./assets/fonts/Archivo-Light.otf") format("opentype");
        font-style: normal;
        font-weight: 300;
        font-display: swap;
      }

      @font-face {
        font-family: "Archivo";
        src: url("./assets/fonts/Archivo-Medium.otf") format("opentype");
        font-style: normal;
        font-weight: 500;
        font-display: swap;
      }

      @font-face {
        font-family: "Archivo";
        src: url("./assets/fonts/Archivo-SemiBold.otf") format("opentype");
        font-style: normal;
        font-weight: 600;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --background: #e5e4d7;
        --foreground: #c23520;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Archivo", Arial, sans-serif;
        overflow-x: hidden;
      }

      main {
        display: flex;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(3rem, 9vh, 5rem) clamp(2.5rem, 6.8vw, 6.5rem)
          clamp(2rem, 4.5vh, 2.75rem);
      }

      .coming-soon {
        display: grid;
        grid-template-rows: 1fr auto;
        gap: clamp(3rem, 7vh, 6.5rem);
        width: 100%;
        min-width: 0;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
      }

      .spread-line {
        display: grid;
        grid-template-columns: repeat(var(--characters), minmax(0, 1fr));
        width: 100%;
        margin: 0;
        color: inherit;
        font: inherit;
        line-height: inherit;
        text-decoration: none;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .spread-line > span {
        min-width: 0;
        text-align: center;
      }

      .spread-line > span:first-child {
        text-align: left;
      }

      .spread-line > span:last-child {
        text-align: right;
      }

      .details {
        display: grid;
        grid-template-columns: 44% 50%;
        align-items: start;
        align-self: center;
        justify-content: space-between;
        width: min(100%, 50.5rem);
        margin: 0 auto;
      }

      .details-copy {
        padding-top: 8%;
        font-size: clamp(0.78rem, 1.18vw, 1.125rem);
        font-weight: 300;
        line-height: 1.35;
        text-align: left;
      }

      .details-title {
        margin: 0 0 0.72em;
        font-size: 3.3em;
        font-weight: 500;
        line-height: 0.92;
      }

      .details-line {
        margin-bottom: 0.62em;
      }

      .details-line.address-last {
        margin-bottom: 1.15em;
      }

      .details-line .label-character {
        font-weight: 600;
      }

      a {
        color: inherit;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.16em;
      }

      a:hover,
      a:focus-visible {
        text-decoration-thickness: 0.14em;
      }

      .visit-booking {
        display: flex;
        justify-content: space-between;
        gap: 0.5em;
        margin-top: 1.8em;
        font-size: 1.05em;
        font-weight: 600;
        line-height: 1.3;
      }

      .coming-soon-title {
        font-size: clamp(2.8rem, 4.3vw, 4.1rem);
        font-weight: 500;
        line-height: 1;
      }

      .details-title,
      .coming-soon-title {
        display: flex;
        justify-content: space-between;
      }

      @media (max-width: 42rem) {
        main {
          padding: 2rem 1.5rem 1.75rem;
        }

        .coming-soon {
          grid-template-rows: auto auto;
          gap: clamp(3rem, 10vh, 5rem);
        }

        .details {
          grid-template-columns: 1fr;
          gap: 2rem;
          width: min(100%, 31rem);
        }

        .logo {
          width: min(58vw, 15rem);
        }

        .details-copy {
          width: min(100%, 25rem);
          padding-top: 0;
          font-size: clamp(0.72rem, 3vw, 0.95rem);
        }

        .details-title {
          font-size: clamp(2.7em, 11vw, 3.3em);
        }

        .visit-booking {
          gap: 0.35em;
          font-size: 1em;
        }

        .coming-soon-title {
          font-size: clamp(1.7rem, 7.6vw, 2.8rem);
        }
      }
    </style>
  </head>

  <body>

            <a

            >

              <span aria-hidden="true">VISITE</span>

        </div>

        <h1

          class="spread-line coming-soon-title"
          style="--characters: 11"

        >
          <span aria-hidden="true">C</span>
          <span aria-hidden="true">O</span>
          <span aria-hidden="true">M</span>
          <span aria-hidden="true">I</span>
          <span aria-hidden="true">N</span>

      </section>
    </main>
  </body>
</html>
