<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e5e4d7" />
    <meta
      name="description"
      content="The Jard — Coming Soon"
    />
    <title>The Jard — Coming Soon</title>

    <style>
      @font-face {
        font-family: "Archivo";
        src: url("./assets/fonts/Archivo-Regular.otf") format("opentype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: "Archivo";
        src: url("./assets/fonts/Archivo-Black.otf") format("opentype");
        font-style: normal;
        font-weight: 900;
        font-display: swap;
      }

      :root {
        color-scheme: light;
        --background: #e5e4d7;
        --foreground: #c23520;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Archivo", Arial, sans-serif;
        overflow-x: hidden;
      }

      main {
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        padding: clamp(3.5rem, 12vh, 6rem) clamp(1.5rem, 5vw, 4rem) 3rem;
      }

      .coming-soon {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 60rem);
        margin: 0 auto;
        text-align: center;
      }

      .logo {
        display: block;
        width: auto;
        height: clamp(17rem, 41vh, 20.5rem);
        max-width: min(70vw, 14.5rem);
        object-fit: contain;
      }

      h1 {
        margin: 0;
        font-size: clamp(5rem, 11.3vw, 10rem);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -0.065em;
        white-space: nowrap;
      }

      .details {
        display: grid;
        grid-template-columns: 14.5rem max-content;
        align-items: center;
        gap: 2.4rem;
        width: max-content;
        max-width: 100%;
        margin-top: clamp(4.25rem, 9vh, 5.25rem);
      }

      .details h2 {
        margin: 0;
        font-size: 3rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.025em;
      }

      .details-copy {
        text-align: left;
      }

      .details address {
        margin-top: 0.25rem;
        font-size: 1.6rem;
        font-style: normal;
        line-height: 1.3;
      }

      .contact-list {
        display: grid;
        gap: 0.15rem;
        margin: 1.55rem 0 0;
        padding: 0;
        font-size: 1.55rem;
        line-height: 1.35;
        list-style: none;
      }

      a {
        color: inherit;
        text-decoration-thickness: 0.08em;
        text-underline-offset: 0.16em;
      }

      a:hover,
      a:focus-visible {
        text-decoration-thickness: 0.14em;
      }

      @media (max-width: 42rem) {
        main {
          padding-top: 3rem;
        }

        h1 {
          font-size: clamp(3.25rem, 14vw, 5.5rem);
        }

        .details {
          grid-template-columns: 1fr;
          justify-items: center;
          gap: 2rem;
          width: 100%;
          margin-top: 3.5rem;
        }

        .details-copy {
          width: min(100%, 25rem);
        }

        .details h2 {
          font-size: clamp(2.25rem, 11vw, 3rem);
        }

        .details address,
        .contact-list {
          font-size: clamp(1.05rem, 5.5vw, 1.4rem);
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section class="coming-soon" aria-labelledby="coming-soon-title">
        <h1 id="coming-soon-title">Coming Soon!</h1>

        <div class="details">
          <img
            class="logo"
            src="./assets/logo.png"
            alt="The Jard"
            width="1054"
            height="1492"
          />

          <div class="details-copy">
            <h2>THE JARD</h2>

            <address>
              Strada della Giardina 12<br />
              10023 Chieri (TO), Italy
            </address>

            <ul class="contact-list" aria-label="Contact details">
              <li>
                <strong>Mail:</strong>
                <a href="mailto:info@thejard.eu">info@thejard.eu</a>
              </li>
              <li>
                <strong>Tel:</strong>
                <a href="tel:+393514096297">+39 351 409 6297</a>
              </li>
              <li>
                <strong>Web:</strong>
                <a href="https://www.thejard.eu">www.thejard.eu</a>
              </li>
              <li>
                <strong>IG:</strong>
                <a href="https://www.instagram.com/thejardgallery/">@thejardgallery</a>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
